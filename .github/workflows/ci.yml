name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, typecheck, lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEND_API_KEY: re_ci_dummy_key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Use the npm version pinned in package.json
        run: npm install --global "npm@$(node --print "require('./package.json').volta.npm")"

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
